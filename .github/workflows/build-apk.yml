# Cross-compiles the servers and builds the optimized release APK, kept as an artifact for 30 days.
# A version tag also publishes it with its source as a GitHub release, which Obtainium can follow.
# A tag with a hyphen, like v0.2.0-beta, makes a prerelease.
# Runs on demand and for tags, not on every push: a full native build takes about an hour.
name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub stops hosted jobs at 6 hours; end first so the logs say why.
    timeout-minutes: 350
    steps:
      # Actions are pinned to commits, as a tag can be moved; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishing uses its own token, so the build has no reason to find one in .git.
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The scripts use the newest NDK and CMake in the SDK, so leave only the pinned ones.
      - name: Install Android toolchain
        run: |
          rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;30.0.16248370" "cmake;4.1.2" "platforms;android-37.0" "build-tools;36.0.0"

      # Termux's repository can drop old package versions; keep the pinned ones.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/.cache
          key: termux-${{ hashFiles('tools/termux.lock.json') }}

      - name: Stage MariaDB
        run: python3 tools/stage_mariadb.py

      # Four jobs, not ninja's default six: the larger files need several GB of RAM each.
      - name: Build AzerothCore and mod-playerbots
        run: python3 tools/build_azerothcore.py --jobs 4

      # One key for every build, so an update installs over the last one and keeps the realm's data.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key (a fork?): this APK won't install over official builds."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/azerothdroid.keystore"
          echo "AZEROTHDROID_KEYSTORE=$RUNNER_TEMP/azerothdroid.keystore" >> "$GITHUB_ENV"

      - name: Set version from the tag
        if: github.ref_type == 'tag'
        run: echo "AZEROTHDROID_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test and build the app
        env:
          AZEROTHDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AZEROTHDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      # Nothing after signing needs the key, and the steps that follow include third-party code.
      # Gradle's daemon goes too, as it would keep the password in its environment.
      - name: Remove signing key
        if: always()
        run: |
          ./gradlew --stop || true
          rm -f "$RUNNER_TEMP/azerothdroid.keystore"

      # GPL-2.0 requires the matching source wherever the APK is offered; see "Publish the release".
      - name: Collect source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/collect_sources.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AzerothDroid-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AzerothDroid-source-${{ github.ref_name }}-${{ github.sha }}
          path: native/.build/source-bundle/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      # The release carries only the APK. Its source goes to one shared "sources" release, which the
      # notes link to, so the license's offer of source sits next to the download.
      # The tag doesn't match v*, so making it doesn't start another build.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sources="https://github.com/$GITHUB_REPOSITORY/releases/tag/sources"
          if ! gh release view sources > /dev/null 2>&1; then
            gh release create sources --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Source code for AzerothDroid releases" \
              --notes "Source for the GPL and LGPL parts of each AzerothDroid APK. source-<version>.txt lists the files that match that version."
          fi
          cp native/.build/source-bundle/README.txt "$RUNNER_TEMP/source-$GITHUB_REF_NAME.txt"
          gh release upload sources native/.build/source-bundle/*.tar.gz "$RUNNER_TEMP/source-$GITHUB_REF_NAME.txt" --clobber

          apk="$RUNNER_TEMP/AzerothDroid-$AZEROTHDROID_VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --verify-tag --generate-notes $prerelease --title "AzerothDroid $AZEROTHDROID_VERSION_NAME" \
            --notes "Source code for this APK: [sources]($sources), files listed in source-$GITHUB_REF_NAME.txt."
